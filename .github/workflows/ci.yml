name: CI

on:
  push:
    branches:
      - develop
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: test-naver-client-id
      NAVER_MAPS_API_KEY_ID: test-naver-key-id
      NAVER_MAPS_API_KEY: test-naver-key
      NAVER_SEARCH_CLIENT_ID: test-search-client-id
      NAVER_SEARCH_CLIENT_SECRET: test-search-client-secret
      GEMINI_API_KEY: test-gemini-key
      GEMINI_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
